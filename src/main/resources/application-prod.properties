# Ative com SPRING_PROFILES_ACTIVE=prod. Banco, chave do Gemini e admin inicial
# vem de variaveis de ambiente (ver application.properties e o README).

server.port=${PORT:8080}
# Atras do proxy do host (Render): respeita X-Forwarded-* para enxergar https.
server.forward-headers-strategy=framework

# Cookie de sessao so trafega por https e nao e lido por JavaScript. Lax basta:
# o front chama a API pelo mesmo dominio (proxy da Vercel).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Documentacao da API nao e exposta publicamente.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Nao devolve stacktrace nem mensagem interna nas respostas de erro.
server.error.include-stacktrace=never
server.error.include-message=never

# Plano gratuito do banco tem poucas conexoes.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false
