spring.datasource.url=jdbc:postgresql://localhost:5432/studojurata
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Sem chave, a aplicacao sobe e a geracao por IA usa o fallback do banco de questoes.
studojurata.ia.gemini.api-key=${GEMINI_API_KEY:}
# Alias "latest" em vez de versao fixa: o Google descontinua modelos fixos com
# frequencia. Contrapartida: o comportamento pode mudar quando o alias mudar.
studojurata.ia.gemini.model=gemini-flash-lite-latest
# O padrao de 8s gerava timeout em picos de latencia da API.
studojurata.ia.gemini.timeout-ms=15000

# Timeout de sessao por inatividade (maximumSessions(1) no SecurityConfig so
# limita sessoes concorrentes).
server.servlet.session.timeout=30m

# Geracao automatica por repeticao espacada: antes do expediente do professor.
studojurata.ia.geracao-automatica.cron=0 0 5 * * *

# Geracao automatica por baixo aproveitamento: 7 dias em ms. Esse motivo nao tem
# data propria de vencimento, entao e reavaliado por intervalo fixo.
studojurata.ia.geracao-automatica.baixo-aproveitamento.intervalo-ms=604800000
