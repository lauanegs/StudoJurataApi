spring.datasource.url=jdbc:postgresql://localhost:5432/studojurata
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
studojurata.ia.gemini.api-key=${GEMINI_API_KEY}
# Historico de tentativas (ver git log): gemini-1.5-flash, gemini-2.5-flash,
# gemini-3.6-flash (503 "high demand") e gemini-2.5-flash-lite foram
# descontinuados em sequencia - Google vem girando modelos fixos rapido
# demais pra acompanhar aqui. Trocado para o alias "latest" que o proprio
# GET /v1beta/models lista (models/gemini-flash-lite-latest) - sempre
# resolve pro modelo lite atual, sem exigir atualizar isto de novo a cada
# descontinuacao. Contrapartida: o comportamento pode mudar sem aviso quando
# o Google trocar o que "latest" aponta - aceitavel aqui (MVP, sem SLA).
studojurata.ia.gemini.model=gemini-flash-lite-latest
# Default (8s) gerou 1 timeout durante o teste real - folga extra pra picos.
studojurata.ia.gemini.timeout-ms=15000

# Correcao 5.3/10.5 da Segunda Analise Critica: "expiracao de sessao" real
# (timeout por inatividade), complementar ao maximumSessions(1) do
# SecurityConfig, que so limita sessoes concorrentes.
server.servlet.session.timeout=30m

# Horario do job de geracao automatica de simulado por repeticao espacada
# (ia/job/GeracaoAutomaticaSimuladoJob) - padrao 5h da manha, antes do
# professor comecar o expediente. Ver o Javadoc da classe para o motivo de
# so cobrir REPETICAO_ESPACADA.
studojurata.ia.geracao-automatica.cron=0 0 5 * * *

# Intervalo (ms) do job de geracao automatica por baixo aproveitamento
# (ia/job/GeracaoAutomaticaBaixoAproveitamentoJob) - padrao 7 dias
# (604800000 ms), confirmado pelo usuario. Motivo sem data propria de
# vencimento, entao reavaliado por intervalo fixo em vez de cron.
studojurata.ia.geracao-automatica.baixo-aproveitamento.intervalo-ms=604800000